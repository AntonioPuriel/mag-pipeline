name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stub-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
      - name: Stub run (default settings)
        run: nextflow run . -profile test -stub-run
      - name: Stub run (per-sample assembly with DAS_Tool refinement)
        run: nextflow run . -profile test -stub-run --assembly_mode per_sample --refine --outdir results_refine
      - name: Stub run (with taxonomy and functional annotation)
        run: nextflow run . -profile test -stub-run --refine --gtdbtk_db assets/NO_FILE --eggnog_db assets/NO_FILE --outdir results_taxonomy
      - name: Stub run (co-assembly by group, every sample mapped against every assembly)
        run: nextflow run . -profile test -stub-run --input assets/samplesheet_test_groups.csv --assembly_mode group --map_all_samples --outdir results_groups
      - name: Stub run (chimera check with GUNC before dereplication)
        run: nextflow run . -profile test -stub-run --input assets/samplesheet_test_groups.csv --assembly_mode group --map_all_samples --refine --dereplicate --gunc_db assets/NO_FILE --gunc_exclude --outdir results_gunc
      - name: Stub run (MIMAG table on the dereplicated genomes, with taxonomy)
        run: nextflow run . -profile test -stub-run --input assets/samplesheet_test_groups.csv --assembly_mode group --map_all_samples --refine --dereplicate --gunc_db assets/NO_FILE --gunc_exclude --gtdbtk_db assets/NO_FILE --mimag --outdir results_mimag
      - name: Stub run (hydrocarbon degradation genes with CANT-HYD and HADEG)
        run: nextflow run . -profile test -stub-run --input assets/samplesheet_test_groups.csv --assembly_mode group --map_all_samples --refine --dereplicate --canthyd_db assets/NO_FILE --hadeg_db assets/NO_FILE --outdir results_hydrocarbons
      - name: Stub run (contig branch: gene catalog, function, CAT taxonomy and SingleM, no binning)
        run: nextflow run . -profile test -stub-run --workflow contigs --eggnog_db assets/NO_FILE --canthyd_db assets/NO_FILE --hadeg_db assets/NO_FILE --cat_db assets/NO_FILE --singlem_db assets/NO_FILE --outdir results_contigs
      - name: Stub run (MAGs and contigs on the same co-assemblies)
        run: nextflow run . -profile test -stub-run --input assets/samplesheet_test_groups.csv --assembly_mode group --map_all_samples --refine --dereplicate --workflow both --canthyd_db assets/NO_FILE --cat_db assets/NO_FILE --outdir results_both
      - name: Unit test (gene depth averaged across assemblies, profiles)
        run: |
          pip install numpy pandas
          bash tests/test_contig_scripts.sh
