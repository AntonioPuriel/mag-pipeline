name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stub-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
      - name: Run pipeline in stub mode
        run: nextflow run . -profile test -stub-run
